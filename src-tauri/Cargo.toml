[package]
name = "omf2097-remastered"
version = "0.4.0"
description = "One Must Fall 2097 Remastered (desktop shell)"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
# Desktop uses the rlib; Tauri mobile loads the same application as a static/shared library.
name = "omf2097_remastered_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
# LAN games (src/lan.rs): their messages, and the network adapters' broadcast addresses for finding games.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15"
# The languages the player's system is set to (the game speaks the first one it has; src/i18n).
sys-locale = "0.3"

# Raw WebView2 event hooks in src/lib.rs (disable_browser_ui). Keep these on the same versions
# Tauri resolves (`cargo tree -i webview2-com`), or the controller types won't match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
